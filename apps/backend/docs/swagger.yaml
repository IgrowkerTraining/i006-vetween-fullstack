        - Visitas
      summary: Inactivar visita
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Visita marcada como inactiva
          content:
              application/json:
                example:
                  success: true
                  message: Visita marcada como inactiva
                  data:
                    id_visitas: 39
                    fecha: 2026-03-09
                    motivo_consulta: Control
                    diagnostico: null
                    tratamiento: null
                    observaciones: null
                    estado: true
                    id_paciente: 80
                    historial_previo: false
        
        "404":
          description: No se encontró la visita
          content:
              application/json:
                example:
                  success: false
                  message: No se encontró la visita

# =========================
# VACUNAS
# =========================

  /vacunas:
    post:
      tags:
        - Vacunas
      summary: Registrar vacuna
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              tipo: Primera dosis
              nombre_cientifico: VCA + P
              fecha_aplicacion: 2026-03-09
              observacion: vacuna anual
              id_paciente: 80

      responses:
        "201":
          description: Vacuna aplicada registrada con éxito
          content:
              application/json:
                example:
                  success: true
                  message: Vacuna aplicada registrada con éxito
                  data:
                    id_vacunas: 21
                    tipo: Primera dosis
                    nombre_cientifico: VCA + P
                    fecha_aplicacion: 2026-03-09
                    observacion: vacuna anual
                    estado: false
                    id_paciente: 80

        "500":
          description: PACIENTE_NO_ENCONTRADO
          content:
              application/json:
                example:
                  success: false
                  message: PACIENTE_NO_ENCONTRADO

  /pacientes/{id}/vacunas:
    get:
      tags:
        - Vacunas
      summary: Historial de vacunas
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Historial de vacunas obtenido
          content:
              application/json:
                example:
                  success: true
                  message: Historial de vacunas obtenido
                  data:
                    -
                      id_vacunas: 21
                      tipo: Primera dosis
                      nombre_cientifico: VCA + P
                      fecha_aplicacion: 2026-03-09
                      observacion: vacuna anual
                      estado: false
                      id_paciente: 80

        "404":
          description: No se encontró el paciente con el ID proporcionado
          content:
              application/json:
                example:
                  success: false
                  message: No se encontró el paciente con el ID proporcionado

  /vacunas/{id}/inactivar:
    patch:
      tags:
        - Vacunas
      summary: Inactivar vacuna
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
