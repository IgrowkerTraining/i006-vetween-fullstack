openapi: 3.0.0
info:
  title: Vetween API
  version: 2.0.0
  description: API para gestión clínica veterinaria con generación de resúmenes clínicos mediante IA.

servers:
  - url: https://backend-vetween.onrender.com/api
    description: Servidor de pruebas
  - url: https://backend-vetween-produccion.onrender.com/api
    description: Servidor de producción

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ErrorValidacion:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error de validación
        errors:
          type: array
          items:
            type: string

    ErrorSimple:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

paths:

# =========================
# AUTH
# =========================

  /auth/register:
    post:
      tags:
        - Auth
      summary: Registrar veterinario y clínica
      description: Registra un nuevo veterinario junto con su clínica.
      requestBody:
        required: true
        content:
          application/json:
            example:
              nombre: Pedro
              apellido: Gomez
              email: pedro.gomez@vet.com
              password: Pass1234
              matricula: 732026
              especialidad:
                - Dermatologia
              tipos_animales:
                - Caninos
                - Felinos
              costo_consulta: 17000
              nombre_consultorio: Veterinaria de Pedro
              num_habilitacion: HAB-2026-070326
              direccion_calle: Av Colon
              direccion_numero: 3478
              direccion_localidad: Carlos Paz
              provincia: Cordoba
              telefono: 54 9 11 6547 9879

      responses:

        "201":
          description: Clínica y Veterinario registrados exitosamente
          content:
            application/json:
              example:
                success: true
                message: Clínica y Veterinario registrados exitosamente
                data:
                  veterinario:
                    id_veterinario: 46
                    nombre: Pedro
                    apellido: Gomez
                    email: pedro.gomez@vet.com
                    contraseña: $2b$10$bqYsxvEWlD5.t3iZW2GMEuKAwxQn6kUlzIvhpBCv2BNHsNGL/ICnO
                    matricula: 732026
                    costo_consulta: 17000
                    id_clinica: 67
                    especialidad:
                      - Dermatologia
                    tipos_animales:
                      - Caninos
                      - Felinos
                  clinica:
                    id_clinica: 67
                    nombre: Veterinaria de Pedro
                    telefono: 54 9 11 6547 9879
                    num_habilitacion: HAB-2026-070326
                    fecha_creacion: 2026-03-07T19:48:44.113673
                    direccion_calle: Av Colon
                    direccion_numero: 3478
                    direccion_localidad: Carlos Paz
                    provincia: Cordoba


        "400":
          description: La calle solo puede contener letras y espacios
          content:
            application/json:
              example:
                success: false
                message: Error de validación
                errors:
                  - La calle solo puede contener letras y espacios

        "409":
          description: El email o la matrícula ya están registrados
          content:
            application/json:
              example:
                success: false
                message: El email o la matrícula ya están registrados

        "500":
          description: Ya existe una clínica registrada con ese número de habilitación.
          content:
            application/json:
              example:
                success: false
                message: Ya existe una clínica registrada con ese número de habilitación.
                error: Ya existe una clínica registrada con ese número de habilitación.

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login de veterinario
      description: Autentica un veterinario y devuelve un token JWT.
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: pedro.gomez@vet.com
              password: Pass1234

      responses:

        "200":
          description: Login exitoso
          content:
            application/json:
              example:
                success: true
                message: Login exitoso
                data:
                  token: JWT_TOKEN
                  user:
                    id_veterinario: 46
                    nombre: Pedro
                    apellido: Gomez
                    email: pedro.gomez@vet.com
                    matricula: 732026
                    costo_consulta: 17000
                    id_clinica: 67
                    especialidad:
                      - Dermatologia
                    tipos_animales:
                      - Caninos
                      - Felinos

# =========================
# RESPONSABLES
# =========================

  /responsables:
    post:
      tags:
        - Responsables
      summary: Crear responsable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              nombre: Maria
              apellido: Gimenez
              email: maria.gimenez@gmail.com
              telefono: "3512412365"
              direccion_calle: Colon
              direccion_numero: 1425
              direccion_localidad: Buenos Aires
              provincia: Buenos Aires
              relacion: Dueño/a

      responses:

        "201":
          description: Responsable creado correctamente
          content:
            application/json:
              example:
                success: true
                message: Responsable creado correctamente
                data:
                  id_responsables: 51
                  nombre: Maria
                  apellido: Gimenez
                  email: maria.gimenez@gmail.com
                  telefono: 3512412365
                  relacion: Dueño/a
                  direccion_calle: Colon
                  direccion_numero: 1425
                  direccion_localidad: Buenos Aires
                  provincia: Buenos Aires
                  id_clinica: 67
                  fecha: 2026-03-07T20:37:15.574712+00:0

        "400":
          description: Error de validación
          content:
            application/json:
              example:
                success: false
                message: Error de validación
                errors:
                  - Debes ingresar un formato de email válido
                  - La calle solo puede contener letras y espacios
                  - Debes seleccionar una provincia válida
                  - Debes seleccionar una relación válida

    get:
      tags:
        - Responsables
      summary: Obtener responsables
      security:
        - bearerAuth: []
      responses:

        "200":
          description: Responsables obtenidos correctamente
          content:
            application/json:
              example:
                success: true
                message: Responsables obtenidos correctamente
                data:
                - 
                  id_responsables: 51
                  nombre: Maria
                  apellido: Gimenez
                  email: maria.gimenez@gmail.com
                  telefono: 3512412365
                  relacion: Dueño/a
                  direccion_calle: Colon
                  direccion_numero: 1425
                  direccion_localidad: Buenos Aires
                  provincia: Buenos Aires
                  id_clinica: 67
                  fecha: 2026-03-07T20:37:15.574712+00:0 -

  /responsables/{id}:
    get:
      tags:
        - Responsables
      summary: Obtener responsable por ID
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:

        "200":
          description: Responsable obtenido correctamente
          content:
            application/json:
              example:
                success: true
                message: Responsable obtenido correctamente
                data:                
                  id_responsables: 51
                  nombre: Maria
                  apellido: Gimenez
                  email: maria.gimenez@gmail.com
                  telefono: 3512412365
                  relacion: Dueño/a
                  direccion_calle: Colon
                  direccion_numero: 1425
                  direccion_localidad: Buenos Aires
                  provincia: Buenos Aires
                  id_clinica: 67
                  fecha: 2026-03-07T20:37:15.574712+00:0
        "404":
          description: Responsable no encontrado
          content:
            application/json:
              example:
                success: false
                message: Responsable no encontrado          

    patch:
      tags:
        - Responsables
      summary: Actualizar responsable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              direccion_localidad: Cordoba

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Responsable actualizado correctamente
          content:
            application/json:
              example:
                success: true
                message: Responsable actualizado correctamente
                data:                
                  id_responsables: 51
                  nombre: Maria
                  apellido: Gimenez
                  email: maria.gimenez@gmail.com
                  telefono: 3512412365
                  relacion: Dueño/a
                  direccion_calle: Colon
                  direccion_numero: 5498
                  direccion_localidad: Cordoba
                  provincia: Buenos Aires
                  id_clinica: 67
                  fecha: 2026-03-07T20:37:15.574712+00:0

        "404":
          description: Responsable no encontrado
          content:
            application/json:
              example:
                success: false
                message: Responsable no encontrado
          

    delete:
      tags:
        - Responsables
      summary: Eliminar responsable
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:

        "200":
          description: Responsable eliminado correctamente
          content:
            application/json:
              example:
                success: true
                message: Responsable eliminado correctamente

        "404":
          description: Responsable no encontrado
          content:
            application/json:
              example:
                success: false
                message: Responsable no encontrado

        "400":
          description: No se puede eliminar un responsable con pacientes asociados
          content:
            application/json:
              example:
                success: false
                message: No se puede eliminar un responsable con pacientes asociados

# =========================
# CLINICA
# =========================

  /clinica:
    get:
      tags:
        - Clínica
      summary: Obtener clínica
      security:
        - bearerAuth: []

      responses:
        "200":
          description: Clínica obtenida exitosamente
          content:
            application/json:
              example:
                success: true
                message: Clínica obtenida exitosamente
                data:
                  id_clinica: 67
                  nombre: Veterinaria de Pedro
                  telefono: 54 9 11 6547 9879
                  email: maria.gimenez@gmail.com
                  num_habilitacion: HAB-2026-070326
                  fecha_creacion: 2026-03-07T19:48:44.113673
                  direccion_calle: Av Colon
                  direccion_numero: 3478
                  direccion_localidad: Carlos Paz
                  provincia: Cordoba


    patch:
      tags:
        - Clínica
      summary: Actualizar clínica
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              nombre: Veterinaria de Pedro
              direccion_calle: Av Italia

      responses:
        "200":
          description: Clínica actualizada exitosamente
          content:
            application/json:
              example:
                success: true
                message: Clínica actualizada exitosamente
                data:
                  id_clinica: 67
                  nombre: Veterinaria de Pedro
                  telefono: 54 9 11 6547 9879
                  num_habilitacion: HAB-2026-070326
                  fecha_creacion: 2026-03-07T19:48:44.113673
                  direccion_calle: Av Italia
                  direccion_numero: 3478
                  direccion_localidad: Carlos Paz
                  provincia: Cordoba

        "400":
            description: La calle solo puede contener letras y espacios
            content:
              application/json:
                example:
                  success: false
                  message: La calle solo puede contener letras y espacios
                  errors:
                    - La calle solo puede contener letras y espacios

# =========================
# PACIENTES
# =========================

  /pacientes:
    post:
      tags:
        - Pacientes
      summary: Crear paciente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              nombre: Paco
              especie: Caninos
              edad: 5
              color: negro
              senia: ojos negros
              sexo: Macho
              raza: bulldog
              peso: 18
              esterilizado: true
              tiene_microchip: false
              id_responsable: 51

      responses:
        "201":
          description: Paciente creado correctamente
          content:
            application/json:
              example:
                success: true
                message: Paciente creado correctamente
                data:
                  id_pacientes: 80
                  nombre: Paco
                  edad: 5
                  color: negro
                  senia: ojos negros
                  sexo: Macho
                  raza: bulldog
                  peso: 18
                  esterilizado: true
                  tiene_microchip: false
                  num_microchip: null
                  activo: false
                  id_responsable: 51
                  id_clinica: 67
                  especie: Caninos
                  fecha: 2026-03-07T21:45:05.434619+00:00

        "400":
          description: Error de validación
          content:
              application/json:
                example:
                  success: false
                  message: La calle solo puede contener letras y espacios
                  errors:
                    - La calle solo puede contener letras y espacios
                    - El número de microchip debe enviarse entre comillas
                    - El número de microchip solo puede contener números sin espacios
                    - El número de microchip ingresado ya se encuentra registrado en otro paciente
                    - El responsable ya tiene un paciente registrado con las mismas características (nombre, especie, edad).
                    - El ID del responsable es obligatorio para registrar al paciente

        "404":
          description: El responsable indicado no existe
          content:
              application/json:
                example:
                  success: false
                  message: El responsable indicado no existe

    get:
      tags:
        - Pacientes
      summary: Obtener pacientes
      security:
        - bearerAuth: []

      responses:
        "200":
          description: Pacientes obtenidos correctamente
          content:
              application/json:
                example:
                  success: true
                  message: Pacientes obtenidos correctamente
                  data:
                    - id_pacientes: 80
                      nombre: Paco
                      edad: 5
                      color: negro
                      senia: ojos negros
                      sexo: Macho
                      raza: bulldog
                      peso: 18
                      esterilizado: true
                      tiene_microchip: false
                      num_microchip: null
                      activo: false
                      id_responsable: 51
                      id_clinica: 67
                      especie: Caninos
                      fecha: 2026-03-07T21:45:05.434619+00:00

                    - id_pacientes: 78
                      nombre: Paco
                      edad: 5
                      color: negro
                      senia: ojos negros
                      sexo: Macho
                      raza: bulldog
                      peso: 18
                      esterilizado: true
                      tiene_microchip: false
                      num_microchip: null
                      activo: false
                      id_responsable: 51
                      id_clinica: 67
                      especie: Caninos
                      fecha: 2026-03-07T21:45:05.434619+00:00

  /pacientes/{id}:
    get:
      tags:
        - Pacientes
      summary: Obtener paciente por ID
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Paciente obtenido correctamente
          content:
              application/json:
                example:
                  success: true
                  message: Paciente obtenido correctamente
                  data:
                    id_pacientes: 80
                    nombre: Paco
                    edad: 5
                    color: negro
                    senia: ojos negros
                    sexo: Macho
                    raza: bulldog
                    peso: 18
                    esterilizado: true
                    tiene_microchip: false
                    num_microchip: null
                    activo: false
                    id_responsable: 51
                    id_clinica: 67
                    especie: Caninos
                    fecha: 2026-03-07T21:45:05.434619+00:00

        "404":
          description: Paciente no encontrado
          content:
              application/json:
                example:
                  success: false
                  message: Paciente no encontrado

    patch:
      tags:
        - Pacientes
      summary: Actualizar paciente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              edad: 8
              senia: oreja derecha caida
              peso: 15

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Paciente actualizado correctamente
          content:
              application/json:
                example:
                  success: true
                  message: Paciente actualizado correctamente
                  data:
                    id_pacientes: 80
                    nombre: Paco
                    edad: 8
                    color: negro
                    senia: oreja derecha caida
                    sexo: Macho
                    raza: bulldog
                    peso: 15
