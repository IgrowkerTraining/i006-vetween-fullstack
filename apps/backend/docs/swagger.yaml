# =========================
# VISITAS
# =========================

  /visitas:
    post:
      tags:
        - Visitas
      summary: Registrar visita
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              fecha: 2026-03-09
              motivo_consulta: Control
              historial_previo: false
              id_paciente: 80

      responses:
        "200":
          description: Visita clínica registrada con éxito
          content:
              application/json:
                example:
                  success: true
                  message: Visita clínica registrada con éxito
                  data:
                    id_visitas: 39
                    fecha: 2026-03-09
                    motivo_consulta: Control
                    diagnostico: null
                    tratamiento: null
                    observaciones: null
                    estado: false
                    id_paciente: 80
                    historial_previo: false

        "404":
          description: El paciente no existe
          content:
              application/json:
                example:
                  success: false
                  message: El paciente no existe

  /pacientes/{id}/visitas:
    get:
      tags:
        - Visitas
      summary: Historial de visitas
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Historial de visitas obtenido
          content:
              application/json:
                example:
                  success: true
                  message: Historial de visitas obtenido
                  data:
                    -
                      id_visitas: 39
                      fecha: 2026-03-09
                      motivo_consulta: Control
                      diagnostico: null
                      tratamiento: null
                      observaciones: null
                      estado: false
                      id_paciente: 80
                      historial_previo: false

        "404":
          description: No se encontró el paciente con el ID proporcionado
          content:
              application/json:
                example:
                  success: false
                  message: No se encontró el paciente con el ID proporcionado

  /visitas/{id}/inactivar:
