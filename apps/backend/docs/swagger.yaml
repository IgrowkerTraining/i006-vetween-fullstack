                    id_responsable: 51
                    id_clinica: 67
                    especie: Caninos
                    fecha: 2026-03-07T21:45:05.434619+00:00

        "404":
          description: Paciente no encontrado
          content:
              application/json:
                example:
                  success: false
                  message: Paciente no encontrado

    delete:
      tags:
        - Pacientes
      summary: Eliminar paciente
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:

        "200":
          description: Paciente eliminado correctamente
          content:
              application/json:
                example:
                  success: true
                  message: Paciente eliminado correctamente

        "400":
          description: No se puede eliminar un paciente con visitas registradas
          content:
              application/json:
                example:
                  success: false
                  message: No se puede eliminar un paciente con visitas registradas
                  

        "404":
          description: Paciente no encontrado
          content:
              application/json:
                example:
